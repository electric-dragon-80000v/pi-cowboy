name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, Lint, Format & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # The commit-message check below diffs against the base branch, so the
          # branch it diffs from has to be in the local history.
          fetch-depth: 0

      - name: Set up pnpm and Node.js 24.20.0
        uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true # the pnpm store, keyed on pnpm-lock.yaml's content hash
          # pnpm and Node only; installing is the explicit step below.
          install: false

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      # The commit-msg hook only guards commits made where husky is installed,
      # and `git commit --no-verify` bypasses it. This checks the range a pull
      # request would merge, so no message reaches `main` that the release
      # workflow cannot turn into a version.
      #
      # The flags are passed without a `--` separator: pnpm forwards that
      # separator to the script verbatim (npm stripped it), and commitlint reads
      # it as end-of-options, which turns `--from`/`--to` into positionals it
      # ignores. The whole history is then linted from the first commit, and
      # `init` fails it.
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: pnpm run commitlint --from "origin/${{ github.event.pull_request.base.ref }}" --to HEAD

      - name: Typecheck
        run: pnpm run typecheck

      - name: Check formatting
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # The published artifact is what users load, and the manifest points pi at
      # `dist/index.js`; pi drops a manifest entry whose file is missing instead
      # of failing, so an unpacked `dist/` ships as an extension that never
      # loads. Assert the tarball itself, including the assets the runtime reads
      # from the package root by path. Read the tarball rather than the packing
      # command's stdout: lifecycle scripts write there too, and would corrupt
      # the pipe.
      - name: Verify the packed tarball
        env:
          HUSKY: 0
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP" > /dev/null
          tarball="$(ls "$RUNNER_TEMP"/pi-cowboy-*.tgz)"
          entries="$(tar -tzf "$tarball" | sed 's|^package/||')"
          for required in \
            package.json \
            dist/index.js \
            agents/explore.toml \
            README.md \
            LICENSE; do
            printf '%s\n' "$entries" | grep -qxF "$required" || {
              echo "tarball is missing $required"
              exit 1
            }
          done
          # Each pattern names the `files` exclusion that keeps it out: `src/` is
          # the point of shipping `dist/`; the tsbuildinfo is the incremental
          # cache; declarations are not part of a runtime-only package; the docs
          # markdown stays reachable through the README's GitHub links; and the
          # two logos are size guards — `logo.png` is a 932 kB source image
          # nothing references, and `logo-pi-package.png` is served from its raw
          # GitHub URL rather than read from the tarball.
          for forbidden in \
            '^src/' \
            '\.tsbuildinfo$' \
            '\.d\.ts$' \
            '^docs/.*\.md$' \
            '^docs/assets/logo\.png$' \
            '^docs/assets/logo-pi-package\.png$' \
            '^orchestrators/'; do
            if printf '%s\n' "$entries" | grep -qE "$forbidden"; then
              echo "tarball should not contain: $(printf '%s\n' "$entries" | grep -E "$forbidden" | head -1)"
              exit 1
            fi
          done
          echo "tarball ok: $(printf '%s\n' "$entries" | wc -l) entries"

      - name: Run unit tests
        run: pnpm run test:unit

  # The filesystem-independent integration set needs real git, a real `herdr`
  # binary on PATH, and the repo's own `pi` reachable by herdr's panes
  # (node_modules/.bin). It runs on the runner's stock ext4 volume, where the
  # copy-on-write materializer falls back rather than clones — which is why no
  # clone-asserting test runs in this job.
  integration:
    name: Integration Tests (ubuntu-latest, ext4)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm and Node.js 24.20.0
        uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true # the pnpm store, keyed on pnpm-lock.yaml's content hash
          # pnpm and Node only; installing is the explicit step below.
          install: false

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Put the repo's pi and herdr on PATH
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install herdr
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          "$HOME/.local/bin/herdr" --version

      # Point the tests' temp repos at a real ext4 mount, so the fallback and
      # checkout paths run against a volume that genuinely cannot clone.
      - name: Pin the temp volume to an ext4 mount
        run: |
          for d in "$RUNNER_TEMP" /tmp /mnt /; do
            fstype="$(findmnt -no FSTYPE -T "$d" 2>/dev/null || echo unknown)"
            echo "$d -> $fstype"
            if [ "$fstype" = "ext4" ]; then
              mkdir -p "$d/pi-cowboy-ci"
              echo "TMPDIR=$d/pi-cowboy-ci" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "no ext4 mount found; using the runner's default temp dir"

      - name: Run integration tests
        run: pnpm run test:integration-no-cow

  # opencode is someone else's binary and its config formats are undocumented, so
  # the one thing that can prove the staging module still works is a real
  # opencode — and the one thing that keeps it honest is installing the current
  # release every run. OpenCode ships through opencode.ai's own channel, so the
  # install is deliberately unpinned there: a new release that stops reading the
  # staged files, or that refuses the argv the harness builds, must redden CI on
  # the release that breaks it, not on a version someone remembered to bump. A
  # dedicated job keeps that signal separate from the herdr/btrfs integration
  # signal, needs no clone-capable volume, and pins nothing.
  integration-opencode:
    name: Integration Tests (latest opencode)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm and Node.js 24.20.0
        uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true # the pnpm store, keyed on pnpm-lock.yaml's content hash
          # pnpm and Node only; installing is the explicit step below.
          install: false

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      # The installer takes its binary from opencode's own update API and, under
      # GITHUB_ACTIONS, appends its bin directory to $GITHUB_PATH for the steps
      # below. `--no-modify-path` keeps it out of the shell rc files, which the
      # runner's later shells never read anyway.
      - name: Install the latest opencode
        run: curl -fsSL https://opencode.ai/v2/install | bash -s -- --no-modify-path

      # A broken install must fail the job here, not let the test skip over it.
      - name: Verify the opencode binary
        run: opencode --version

      # PI_COWBOY_REQUIRE_OPENCODE turns a missing binary into a failing test
      # instead of a silent skip, so the only way this job passes is by running
      # the assertions above.
      - name: Run the opencode staging integration test
        env:
          PI_COWBOY_REQUIRE_OPENCODE: "1"
        run: pnpm exec vitest run --project integration-no-cow test/opencode-staging.integration.test.ts

  # codex is someone else's binary and its config-override parsing is
  # undocumented, so the one thing that can prove the launch flags still work
  # is a real codex — and the one thing that keeps it honest is installing the
  # latest release every run. The install is deliberately unpinned: a new codex
  # that stops reading `model_instructions_file`, or that changes the bundled
  # catalog shape the model list parses, must redden CI on the release that
  # breaks it, not on a version someone remembered to bump. A dedicated job
  # keeps that signal separate from the herdr/btrfs integration signal, needs
  # no clone-capable volume, and pins nothing.
  integration-codex:
    name: Integration Tests (latest codex)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm and Node.js 24.20.0
        uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true # the pnpm store, keyed on pnpm-lock.yaml's content hash
          # pnpm and Node only; installing is the explicit step below.
          install: false

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      # The npm distribution is codex's official cross-platform install. npm
      # takes its global prefix from the node binary that runs it, and
      # pnpm/setup's node shim comes first on PATH, so the prefix is pnpm's
      # runtime store under $PNPM_HOME: codex's bin lands beside the runtime's
      # own node, in a directory PATH does not already carry. The prefix's bin
      # directory is what makes `codex` reachable in the steps below.
      - name: Install the latest codex
        run: |
          npm install -g @openai/codex
          echo "$(npm prefix -g)/bin" >> "$GITHUB_PATH"

      # A broken install must fail the job here, not let the test skip over it.
      - name: Verify the codex binary
        run: codex --version

      # PI_COWBOY_REQUIRE_CODEX turns a missing binary into a failing test
      # instead of a silent skip, so the only way this job passes is by running
      # the assertions above.
      - name: Run the codex harness integration test
        env:
          PI_COWBOY_REQUIRE_CODEX: "1"
        run: pnpm exec vitest run --project integration-no-cow test/codex-harness.integration.test.ts

  # Both integration projects on a btrfs loop device, so the clone path actually
  # clones. The tests' temp repos land on the volume through TMPDIR
  # (os.tmpdir() honours it).
  integration-btrfs:
    name: Integration Tests (ubuntu-latest, btrfs CoW)
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - uses: actions/checkout@v7

      - name: Set up pnpm and Node.js 24.20.0
        uses: pnpm/setup@v3
        with:
          runtime: node@24.20.0
          cache: true # the pnpm store, keyed on pnpm-lock.yaml's content hash
          # pnpm and Node only; installing is the explicit step below.
          install: false

      - name: Install dependencies
        run: HUSKY=0 pnpm install --frozen-lockfile

      - name: Put the repo's pi and herdr on PATH
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Install herdr
        run: |
          curl -fsSL https://herdr.dev/install.sh | sh
          "$HOME/.local/bin/herdr" --version

      - name: Mount a btrfs loop device
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq btrfs-progs
          sudo mkdir -p /mnt/cow
          # /mnt is the runner's large root-owned volume, so the sparse backing
          # image has to be created with sudo; losetup, mkfs and mount are
          # privileged regardless. nodiscard keeps a loop-backed btrfs backed by
          # a sparse file reporting honest allocation sizes, which is what lets
          # `cp --reflink` clone instead of copying bytes.
          img=/mnt/cow.img
          sudo truncate -s 8G "$img"
          loop="$(sudo losetup --find --show "$img")"
          sudo mkfs.btrfs -L cow --nodiscard "$loop"
          sudo mount -o nodiscard "$loop" /mnt/cow
          sudo chown -R "$(id -u):$(id -g)" /mnt/cow
          findmnt -no FSTYPE /mnt/cow
          # Fail here, not in the suite, if the volume cannot clone: the point
          # of this job is that the copy-on-write path really clones.
          echo probe > /mnt/cow/.cow-probe
          cp --reflink=always /mnt/cow/.cow-probe /mnt/cow/.cow-probe.clone
          rm -f /mnt/cow/.cow-probe /mnt/cow/.cow-probe.clone

      - name: Run integration tests
        env:
          TMPDIR: /mnt/cow
        run: pnpm run test:integration
